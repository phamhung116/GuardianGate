name: guardiangate

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardiangate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardiangate
      POSTGRES_USER: guardiangate
      POSTGRES_PASSWORD: guardiangate
    ports:
      - "5434:5432"
    volumes:
      - guardiangate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardiangate -d guardiangate"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TideCloak Dev for local OIDC. The admin console is http://localhost:8080 (local demo
  # credentials only). Realm `guardiangate` and client `guardiangate-web` are provisioned in the
  # console and the Tide account enrollment is completed in the browser.
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: guardiangate-tidecloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    ports:
      - "8080:8080"
    volumes:
      # Mount the image's data dir (owned by the keycloak user) so the H2 store is writable.
      - guardiangate-tidecloak-data:/opt/keycloak/data

volumes:
  guardiangate-postgres-data:
  guardiangate-tidecloak-data:
